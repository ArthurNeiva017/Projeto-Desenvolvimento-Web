<!DOCTYPE html>
{% load static %}
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}CineTrack{% endblock %} | CineTrack</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografia da identidade visual -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        {% include "menu.html" %}
    </header>

    <main class="container py-4 flex-grow-1" aria-label="Conteúdo principal">
        {% include "messages.html" %}
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer class="ct-footer py-3 mt-auto">
        <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2 small">
            <span>&copy; 2026 CineTrack · Desenvolvimento Web · UniCEUB</span>
            <span>Dados de filmes e séries fornecidos por TMDB.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
