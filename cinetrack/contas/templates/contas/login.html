{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="form-container ct-card p-4 p-md-5">
    <h2 class="mb-4">Entrar</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" value="{{ username|default:'' }}" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-ct w-100">Entrar</button>
    </form>
    <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a href="{% url 'register' %}">Registrar-se</a></p>
</div>
{% endblock %}
