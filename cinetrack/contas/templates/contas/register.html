{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="form-container ct-card p-4 p-md-5">
    <h2 class="mb-4">Criar conta</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" maxlength="150" value="{{ username|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail (opcional)</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ email|default:'' }}">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
            <div class="form-text">Mínimo de 8 caracteres, sem ser apenas números ou uma senha comum.</div>
        </div>
        <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirme a senha</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-ct w-100">Registrar</button>
    </form>
    <p class="mt-3 mb-0 text-center">Já tem conta? <a href="{% url 'login' %}">Faça login</a></p>
</div>
{% endblock %}
